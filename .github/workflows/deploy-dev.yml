name: deploy-dev

# Despliega el backend al entorno de desarrollo al mergear a `develop`.
# Regenera el `.env` del servidor desde los secretos del environment
# `desarrollo` y luego ejecuta el script de deploy (script versionado en el
# repo `infra`). Para agregar una variable nueva: crea el secret y añade una
# línea en el bloque de abajo.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  # GitHub actualiza el estado del deployment automaticamente; sin este
  # permiso el GITHUB_TOKEN es de solo lectura y no puede reportarlo.
  deployments: write

concurrency:
  group: deploy-dev-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar backend en desarrollo
    runs-on: ubuntu-latest
    environment: desarrollo
    # Un push hecho por el propio bot no debe re-disparar el deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pusher.name != 'github-actions[bot]'
    steps:
      - name: Instalar llave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_PORT:-}" ]; then
            echo "::error::Faltan secrets de despliegue (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT) en el environment 'desarrollo'."
            exit 1
          fi

          mkdir -p ~/.ssh
          # La llave es PEM y puede traer CRLF: se normaliza a LF.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # La llave tiene passphrase y el runner no es interactivo, asi que
          # ssh-add necesita un askpass que se la entregue.
          #
          # El agente y el askpass se dejan en ~/.ssh porque **cada paso del
          # workflow corre en un shell nuevo**: lo que se exporta aqui no llega
          # al paso siguiente. Los pasos que usan `ssh` vuelven a cargarlos con
          # `. ~/.ssh/agent_env`.
          if [ -n "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY_PASSPHRASE" > ~/.ssh/deploy_passphrase
            chmod 600 ~/.ssh/deploy_passphrase
            printf '%s\n' '#!/usr/bin/env bash' 'cat ~/.ssh/deploy_passphrase' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            # ssh-agent -s imprime tambien un "echo Agent pid ..." que no es
            # un comando valido como script: se filtran solo los export.
            ssh-agent -s | grep '^SSH_AUTH_SOCK\|^SSH_AGENT_PID' > ~/.ssh/agent_env
            . ~/.ssh/agent_env
            if ! ssh-add ~/.ssh/deploy_key; then
              echo "::error::No se pudo cargar la llave en el agente SSH. Revisa DEPLOY_SSH_KEY_PASSPHRASE."
              exit 1
            fi
            echo "Llave cargada en el agente SSH."
          fi

          # La clave del host se fija por fingerprint: no se acepta la primera
          # conexion a ciegas. Si el host cambia, hay que actualizar el secret.
          # La clave del host ya no se acepta "a ciegas": se compara con la
          # que esta en el secret DEPLOY_HOST_KEY. Si no coincide (el host
          # cambio o hay un intermediario), el deploy se detiene.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/host_keys 2>&1 || true
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            if ! grep -qF "$DEPLOY_HOST_KEY" /tmp/host_keys; then
              echo "::error::La clave del host no coincide con DEPLOY_HOST_KEY."
              echo "::error::Si el host cambio de verdad, actualiza el secret antes de desplegar."
              exit 1
            fi
          fi
          if [ ! -s /tmp/host_keys ]; then
            echo "::error::No se pudo obtener la clave del host $DEPLOY_HOST:$DEPLOY_PORT."
            echo "::error::Detalle del escaneo:"
            cat /tmp/host_keys
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts

      - name: Regenerar .env del backend en el servidor
        env:
          NODE_ENV: development
          PORT: "3333"
          HOST: "0.0.0.0"
          API_PREFIX: api/v1
          APP_NAME: dolynglish-backend
          LOG_LEVEL: debug
          DB_HOST: doly-dev-db
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_LOGGING: "false"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL }}
          JWT_REFRESH_TTL: 30d
          AI_DEFAULT_PROVIDER: ${{ vars.AI_DEFAULT_PROVIDER }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          MINIMAX_REASONING_EFFORT: ${{ vars.MINIMAX_REASONING_EFFORT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # IA y moderacion. Las keys son secrets; los parametros de
          # configuracion son variables del environment (mismo nombre en todos
          # los ambientes, distinto valor). Ver conventions/environment.md.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_MODEL: ${{ vars.GOOGLE_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODERATION_ENDPOINT: ${{ vars.OPENAI_MODERATION_ENDPOINT }}
          OPENAI_MODERATION_MODEL: ${{ vars.OPENAI_MODERATION_MODEL }}
          CATEGORY_MODERATION_ENABLED: ${{ vars.CATEGORY_MODERATION_ENABLED }}
          CATEGORY_MODERATION_AI_ENABLED: ${{ vars.CATEGORY_MODERATION_AI_ENABLED }}
          CATEGORY_MODERATION_AI_PROVIDER: ${{ vars.CATEGORY_MODERATION_AI_PROVIDER }}
          CATEGORY_DAILY_LIMIT: ${{ vars.CATEGORY_DAILY_LIMIT }}
          CATEGORY_MODERATION_SCORE_THRESHOLD: ${{ vars.CATEGORY_MODERATION_SCORE_THRESHOLD }}
          CATEGORY_MODERATION_TIMEOUT_MS: ${{ vars.CATEGORY_MODERATION_TIMEOUT_MS }}
          CATEGORY_MODERATION_CACHE_TTL_MS: ${{ vars.CATEGORY_MODERATION_CACHE_TTL_MS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          # Base publica del frontend: se usa para construir los enlaces de los
          # correos de confirmacion y de restablecimiento de contrasena.
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}
          # Exige confirmar el correo antes de poder iniciar sesion.
          EMAIL_VERIFICATION_REQUIRED: ${{ vars.EMAIL_VERIFICATION_REQUIRED }}
          # Pasarela de pagos (Stripe Sandbox / manual). En dev tras VPN suele quedar en `manual`.
          BILLING_PROVIDER: ${{ vars.BILLING_PROVIDER }}
          BILLING_ENV_TAG: ${{ vars.BILLING_ENV_TAG }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CURRENCY: ${{ vars.STRIPE_CURRENCY }}
          STRIPE_CHECKOUT_UI_MODE: ${{ vars.STRIPE_CHECKOUT_UI_MODE }}
          STRIPE_PRICE_DOLLY: ${{ vars.STRIPE_PRICE_DOLLY }}
          STRIPE_PRICE_DOLLY_PLUS: ${{ vars.STRIPE_PRICE_DOLLY_PLUS }}
          STRIPE_PRICE_DOLLY_PRO: ${{ vars.STRIPE_PRICE_DOLLY_PRO }}
          STRIPE_PRICE_LANGUAGE_UNLOCK: ${{ vars.STRIPE_PRICE_LANGUAGE_UNLOCK }}
          # Autenticacion externa OAuth 2.0 / OIDC (Google y Microsoft Entra ID).
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ vars.MICROSOFT_OAUTH_CLIENT_ID }}
          MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.MICROSOFT_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_TENANT: ${{ vars.MICROSOFT_OAUTH_TENANT }}
          MICROSOFT_OAUTH_REDIRECT_URI: ${{ vars.MICROSOFT_OAUTH_REDIRECT_URI }}
          # Seguridad anti-bot (Cloudflare Turnstile) y CORS.
          CAPTCHA_PROVIDER: ${{ vars.CAPTCHA_PROVIDER }}
          CAPTCHA_SITE_KEY: ${{ vars.CAPTCHA_SITE_KEY }}
          CAPTCHA_SECRET_KEY: ${{ secrets.CAPTCHA_SECRET_KEY }}
          CAPTCHA_APPEARANCE: ${{ vars.CAPTCHA_APPEARANCE }}
          CAPTCHA_ALLOWED_HOSTNAMES: ${{ vars.CAPTCHA_ALLOWED_HOSTNAMES }}
          CAPTCHA_FAIL_OPEN: ${{ vars.CAPTCHA_FAIL_OPEN }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          {
            printf 'NODE_ENV=%s\n'        "$NODE_ENV"
            printf 'PORT=%s\n'            "$PORT"
            printf 'HOST=%s\n'            "$HOST"
            printf 'API_PREFIX=%s\n'      "$API_PREFIX"
            printf 'APP_NAME=%s\n'        "$APP_NAME"
            printf 'LOG_LEVEL=%s\n'       "$LOG_LEVEL"
            printf 'DB_HOST=%s\n'         "$DB_HOST"
            printf 'DB_PORT=%s\n'         "$DB_PORT"
            printf 'DB_USER=%s\n'         "$DB_USER"
            printf 'DB_PASSWORD=%s\n'     "$DB_PASSWORD"
            printf 'DB_DATABASE=%s\n'     "$DB_DATABASE"
            printf 'DB_LOGGING=%s\n'      "$DB_LOGGING"
            printf 'JWT_SECRET=%s\n'      "$JWT_SECRET"
            printf 'JWT_ACCESS_TTL=%s\n'  "$JWT_ACCESS_TTL"
            printf 'JWT_REFRESH_TTL=%s\n' "$JWT_REFRESH_TTL"
            printf 'AI_DEFAULT_PROVIDER=%s\n' "$AI_DEFAULT_PROVIDER"
            printf 'MINIMAX_API_KEY=%s\n' "$MINIMAX_API_KEY"
            printf 'MINIMAX_MODEL=%s\n'   "$MINIMAX_MODEL"
            printf 'MINIMAX_REASONING_EFFORT=%s\n' "$MINIMAX_REASONING_EFFORT"
            printf 'GROQ_API_KEY=%s\n'    "$GROQ_API_KEY"
            printf 'GOOGLE_API_KEY=%s\n'  "$GOOGLE_API_KEY"
            printf 'GOOGLE_MODEL=%s\n'   "$GOOGLE_MODEL"
            printf 'OPENAI_API_KEY=%s\n'  "$OPENAI_API_KEY"
            printf 'OPENAI_MODERATION_ENDPOINT=%s\n' "$OPENAI_MODERATION_ENDPOINT"
            printf 'OPENAI_MODERATION_MODEL=%s\n' "$OPENAI_MODERATION_MODEL"
            printf 'CATEGORY_MODERATION_ENABLED=%s\n' "$CATEGORY_MODERATION_ENABLED"
            printf 'CATEGORY_MODERATION_AI_ENABLED=%s\n' "$CATEGORY_MODERATION_AI_ENABLED"
            printf 'CATEGORY_MODERATION_AI_PROVIDER=%s\n' "$CATEGORY_MODERATION_AI_PROVIDER"
            printf 'CATEGORY_DAILY_LIMIT=%s\n' "$CATEGORY_DAILY_LIMIT"
            printf 'CATEGORY_MODERATION_SCORE_THRESHOLD=%s\n' "$CATEGORY_MODERATION_SCORE_THRESHOLD"
            printf 'CATEGORY_MODERATION_TIMEOUT_MS=%s\n' "$CATEGORY_MODERATION_TIMEOUT_MS"
            printf 'CATEGORY_MODERATION_CACHE_TTL_MS=%s\n' "$CATEGORY_MODERATION_CACHE_TTL_MS"
            printf 'SMTP_HOST=%s\n'       "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n'       "$SMTP_PORT"
            printf 'SMTP_USER=%s\n'       "$SMTP_USER"
            printf 'SMTP_PASSWORD=%s\n'   "$SMTP_PASSWORD"
            printf 'SMTP_FROM=%s\n'       "$SMTP_FROM"
            printf 'SMTP_FROM_NAME=%s\n'  "$SMTP_FROM_NAME"
            printf 'SMTP_SECURE=%s\n'     "$SMTP_SECURE"
            printf 'FRONTEND_BASE_URL=%s\n' "$FRONTEND_BASE_URL"
            printf 'EMAIL_VERIFICATION_REQUIRED=%s\n' "$EMAIL_VERIFICATION_REQUIRED"
            printf 'BILLING_PROVIDER=%s\n' "$BILLING_PROVIDER"
            printf 'BILLING_ENV_TAG=%s\n'  "$BILLING_ENV_TAG"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
            printf 'STRIPE_PUBLISHABLE_KEY=%s\n' "$STRIPE_PUBLISHABLE_KEY"
            printf 'STRIPE_CURRENCY=%s\n'  "$STRIPE_CURRENCY"
            printf 'STRIPE_CHECKOUT_UI_MODE=%s\n' "$STRIPE_CHECKOUT_UI_MODE"
            printf 'STRIPE_PRICE_DOLLY=%s\n' "$STRIPE_PRICE_DOLLY"
            printf 'STRIPE_PRICE_DOLLY_PLUS=%s\n' "$STRIPE_PRICE_DOLLY_PLUS"
            printf 'STRIPE_PRICE_DOLLY_PRO=%s\n' "$STRIPE_PRICE_DOLLY_PRO"
            printf 'STRIPE_PRICE_LANGUAGE_UNLOCK=%s\n' "$STRIPE_PRICE_LANGUAGE_UNLOCK"
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
            printf 'GOOGLE_OAUTH_REDIRECT_URI=%s\n' "$GOOGLE_OAUTH_REDIRECT_URI"
            printf 'MICROSOFT_OAUTH_CLIENT_ID=%s\n' "$MICROSOFT_OAUTH_CLIENT_ID"
            printf 'MICROSOFT_OAUTH_CLIENT_SECRET=%s\n' "$MICROSOFT_OAUTH_CLIENT_SECRET"
            printf 'MICROSOFT_OAUTH_TENANT=%s\n' "$MICROSOFT_OAUTH_TENANT"
            printf 'MICROSOFT_OAUTH_REDIRECT_URI=%s\n' "$MICROSOFT_OAUTH_REDIRECT_URI"
            printf 'CAPTCHA_PROVIDER=%s\n' "$CAPTCHA_PROVIDER"
            printf 'CAPTCHA_SITE_KEY=%s\n' "$CAPTCHA_SITE_KEY"
            printf 'CAPTCHA_SECRET_KEY=%s\n' "$CAPTCHA_SECRET_KEY"
            printf 'CAPTCHA_APPEARANCE=%s\n' "$CAPTCHA_APPEARANCE"
            printf 'CAPTCHA_ALLOWED_HOSTNAMES=%s\n' "$CAPTCHA_ALLOWED_HOSTNAMES"
            printf 'CAPTCHA_FAIL_OPEN=%s\n' "$CAPTCHA_FAIL_OPEN"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
          } > /tmp/backend.env
          base64 -w0 /tmp/backend.env | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077 && base64 -d > '${{ secrets.ORG_PATH }}/dolynation-atl-back/.env'"

      - name: Desplegar (pull + restart + healthcheck)
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/scripts/deploy-dev-back.sh'"
