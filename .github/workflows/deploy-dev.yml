name: deploy-dev

# Despliega el backend al entorno de desarrollo al mergear a `develop`.
# Regenera el `.env` del servidor desde los secretos del environment
# `desarrollo` y luego ejecuta el script de deploy (script versionado en el
# repo `infra`). Para agregar una variable nueva: crea el secret y añade una
# línea en el bloque de abajo.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  # GitHub actualiza el estado del deployment automaticamente; sin este
  # permiso el GITHUB_TOKEN es de solo lectura y no puede reportarlo.
  deployments: write

concurrency:
  group: deploy-dev-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Desplegar backend en desarrollo
    runs-on: ubuntu-latest
    environment: desarrollo
    # Un push hecho por el propio bot no debe re-disparar el deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.pusher.name != 'github-actions[bot]'
    steps:
      - name: Instalar llave SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_PASSPHRASE: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi

          if [ -z "${DEPLOY_SSH_KEY:-}" ] || [ -z "${DEPLOY_HOST:-}" ] || [ -z "${DEPLOY_PORT:-}" ]; then
            echo "::error::Faltan secrets de despliegue (DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_PORT) en el environment 'desarrollo'."
            exit 1
          fi

          mkdir -p ~/.ssh
          # La llave es PEM y puede traer CRLF: se normaliza a LF.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # La llave tiene passphrase y el runner no es interactivo, asi que
          # ssh-add necesita un askpass que se la entregue.
          #
          # El agente y el askpass se dejan en ~/.ssh porque **cada paso del
          # workflow corre en un shell nuevo**: lo que se exporta aqui no llega
          # al paso siguiente. Los pasos que usan `ssh` vuelven a cargarlos con
          # `. ~/.ssh/agent_env`.
          if [ -n "${DEPLOY_SSH_KEY_PASSPHRASE:-}" ]; then
            printf '%s\n' "$DEPLOY_SSH_KEY_PASSPHRASE" > ~/.ssh/deploy_passphrase
            chmod 600 ~/.ssh/deploy_passphrase
            printf '%s\n' '#!/usr/bin/env bash' 'cat ~/.ssh/deploy_passphrase' > ~/.ssh/askpass.sh
            chmod 700 ~/.ssh/askpass.sh
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
            # ssh-agent -s imprime tambien un "echo Agent pid ..." que no es
            # un comando valido como script: se filtran solo los export.
            ssh-agent -s | grep '^SSH_AUTH_SOCK\|^SSH_AGENT_PID' > ~/.ssh/agent_env
            . ~/.ssh/agent_env
            if ! ssh-add ~/.ssh/deploy_key; then
              echo "::error::No se pudo cargar la llave en el agente SSH. Revisa DEPLOY_SSH_KEY_PASSPHRASE."
              exit 1
            fi
            echo "Llave cargada en el agente SSH."
          fi

          # La clave del host se fija por fingerprint: no se acepta la primera
          # conexion a ciegas. Si el host cambia, hay que actualizar el secret.
          # La clave del host ya no se acepta "a ciegas": se compara con la
          # que esta en el secret DEPLOY_HOST_KEY. Si no coincide (el host
          # cambio o hay un intermediario), el deploy se detiene.
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /tmp/host_keys 2>&1 || true
          if [ -n "${DEPLOY_HOST_KEY:-}" ]; then
            if ! grep -qF "$DEPLOY_HOST_KEY" /tmp/host_keys; then
              echo "::error::La clave del host no coincide con DEPLOY_HOST_KEY."
              echo "::error::Si el host cambio de verdad, actualiza el secret antes de desplegar."
              exit 1
            fi
          fi
          if [ ! -s /tmp/host_keys ]; then
            echo "::error::No se pudo obtener la clave del host $DEPLOY_HOST:$DEPLOY_PORT."
            echo "::error::Detalle del escaneo:"
            cat /tmp/host_keys
            exit 1
          fi
          cat /tmp/host_keys >> ~/.ssh/known_hosts

      - name: Regenerar .env del backend en el servidor
        env:
          NODE_ENV: development
          PORT: "3333"
          HOST: "0.0.0.0"
          API_PREFIX: api/v1
          APP_NAME: dolynglish-backend
          LOG_LEVEL: debug
          DB_HOST: doly-dev-db
          DB_PORT: "5432"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_LOGGING: "false"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TTL: 15m
          JWT_REFRESH_TTL: 30d
          AI_DEFAULT_PROVIDER: minimax
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          {
            printf 'NODE_ENV=%s\n'        "$NODE_ENV"
            printf 'PORT=%s\n'            "$PORT"
            printf 'HOST=%s\n'            "$HOST"
            printf 'API_PREFIX=%s\n'      "$API_PREFIX"
            printf 'APP_NAME=%s\n'        "$APP_NAME"
            printf 'LOG_LEVEL=%s\n'       "$LOG_LEVEL"
            printf 'DB_HOST=%s\n'         "$DB_HOST"
            printf 'DB_PORT=%s\n'         "$DB_PORT"
            printf 'DB_USER=%s\n'         "$DB_USER"
            printf 'DB_PASSWORD=%s\n'     "$DB_PASSWORD"
            printf 'DB_DATABASE=%s\n'     "$DB_DATABASE"
            printf 'DB_LOGGING=%s\n'      "$DB_LOGGING"
            printf 'JWT_SECRET=%s\n'      "$JWT_SECRET"
            printf 'JWT_ACCESS_TTL=%s\n'  "$JWT_ACCESS_TTL"
            printf 'JWT_REFRESH_TTL=%s\n' "$JWT_REFRESH_TTL"
            printf 'AI_DEFAULT_PROVIDER=%s\n' "$AI_DEFAULT_PROVIDER"
            printf 'MINIMAX_API_KEY=%s\n' "$MINIMAX_API_KEY"
            printf 'MINIMAX_MODEL=%s\n'   "$MINIMAX_MODEL"
            printf 'GROQ_API_KEY=%s\n'    "$GROQ_API_KEY"
          } > /tmp/backend.env
          base64 -w0 /tmp/backend.env | ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "umask 077 && base64 -d > '${{ secrets.ORG_PATH }}/dolynation-atl-back/.env'"

      - name: Desplegar (pull + restart + healthcheck)
        run: |
          set -euo pipefail
          # El agente SSH se creo en el paso anterior, en otro shell: hay que
          # volver a cargarlo aqui para que `ssh` pueda usar la llave cifrada.
          if [ -f ~/.ssh/agent_env ]; then
            . ~/.ssh/agent_env
            export SSH_ASKPASS=~/.ssh/askpass.sh
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0
          fi
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash '${{ secrets.ORG_PATH }}/dolynation-tlalli-infra/scripts/deploy-dev-back.sh'"

