name: build-images

# Construye la imagen del servicio y la publica en GHCR.
#
# Reglas de las etiquetas:
#
#   - **SHA del commit**: siempre. Es inmutable: es lo que se despliega en
#     rehearsal, staging y produccion, y lo que permite volver atras
#     (rollback) con un comando.
#   - **version**: solo cuando la build corresponde a una release concreta
#     (un tag `vX.Y.Z` o un tag pedido a mano). La etiqueta por version es
#     comoda para leer, pero NO se usa para desplegar: si se moviera, el
#     rollback dejaria de ser exacto.
#   - **latest**: solo en `develop`, como puntero al estado actual.
#
# El deploy NUNCA compila en el servidor: compila aqui, una vez, y el
# servidor solo descarga el artefacto. Si dos maquinas compilaran el mismo
# commit, no serian el mismo binario.
#
# Ver operations/FLUJO-DE-RELEASE.md.

on:
  push:
    branches:
      - develop
      # La rama rc-<version> es la que se promueve a staging.
      - 'rc-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a construir (vacio = el del commit actual)'
        required: false
        type: string

permissions:
  contents: read
  # `packages: write` es lo que permite publicar la imagen en GHCR. Sin este
  # permiso el push falla con "denied".
  packages: write

concurrency:
  group: build-images-${{ github.repository }}
  # No se cancela: una imagen a medio publicar es peor que una que tarda.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # `github.repository` es el nombre del repo. Ojo: `github.event.repository`
  # es un OBJETO y hacia fallar todo el workflow al validarlo.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Construir imagen
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Decidir que se construye
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          CHECKOUT_REF="$REF"
          VERSION=""

          # Si se dispara por un tag vX.Y.Z, ese es el commit y esa la version.
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          fi

          # Si se dispara a mano con un tag, se construye ese tag.
          if [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
            CHECKOUT_REF="v${VERSION}"
          fi

          echo "ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.prepare.outputs.ref }}

      - name: Calcular las etiquetas
        id: meta
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"

          if [ -n "$VERSION" ]; then
            tags="$(printf '%s\n' "${IMAGE}:${SHA}" "${IMAGE}:${VERSION}")"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            tags="$(printf '%s\n' "${IMAGE}:${SHA}" "${IMAGE}:latest")"
          else
            tags="${IMAGE}:${SHA}"
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "built_at=$BUILT_AT" >> "$GITHUB_OUTPUT"

          # Un valor con varias lineas en GITHUB_OUTPUT necesita el formato
          # con delimitador: `echo "clave=valor"` solo admite una linea y
          # falla con "Invalid format".
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "sha=$SHA"
          echo "version=$VERSION"
          echo "image=$IMAGE"
          echo "built_at=$BUILT_AT"
          echo "tags:"
          echo "$tags"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          # Se autentica con el PAT, no con el GITHUB_TOKEN: los paquetes de
          # GHCR de la organizacion no estan vinculados a los repos, y el
          # GITHUB_TOKEN de un repo no puede empujar a un paquete sin vinculo
          # (falla con "denied: read_package").
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            COMPONENT=${{ github.repository }}
            BUILT_AT=${{ steps.meta.outputs.built_at }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumir
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\`"
            echo "- version: \`${{ steps.meta.outputs.version }}\`"
            echo "- commit: \`${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
