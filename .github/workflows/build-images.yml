name: build-images

# Construye la imagen del servicio y la publica en GHCR.
#
# La imagen se etiqueta con dos cosas:
#   - el **SHA** del commit: inmutable, es lo que se despliega en staging y
#     produccion, y lo que permite volver atras (rollback).
#   - la **versión** de la release: comoda para leer, pero puede moverse.
#
# El deploy NUNCA compila en el servidor: compila aqui, una vez, y el
# servidor solo descarga el artefacto. Si dos maquinas compilaran el mismo
# commit, no serian el mismo binario.
#
# Ver operations/PLAN-DE-DESPLIEGUE.md.

on:
  push:
    branches:
      - develop
      # La rama rc-<version> es la que se promueve a staging.
      - 'rc-*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a construir (vacio = el del commit actual)'
        required: false
        type: string

permissions:
  contents: read
  # `packages: write` es lo que permite publicar la imagen en GHCR. Sin este
  # permiso el push falla con "denied".
  packages: write

concurrency:
  group: build-images-${{ github.repository }}
  # No se cancela: una imagen a medio publicar es peor que una que tarda.
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository }}

jobs:
  build:
    name: Construir imagen
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Calcular las etiquetas
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          SHA="$(git rev-parse HEAD)"
          VERSION=""

          # Si se dispara por un tag vX.Y.Z, esa es la version.
          if [ "$EVENT" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          fi

          # Si se dispara a mano con un tag, ese es el que se construye.
          if [ -n "$INPUT_TAG" ]; then
            VERSION="${INPUT_TAG#v}"
          fi

          # Si no hay tag, la version sale del manifiesto del proyecto
          # (versions.yml en dolynation-tlalli-infra), que es donde vive la
          # version UNICA de la aplicacion.
          if [ -z "$VERSION" ]; then
            echo "::notice::No hay tag: la version sale del manifiesto."
            MANIFEST="https://raw.githubusercontent.com/DolyLanguagesORG/dolynation-tlalli-infra/develop/versions.yml"
            VERSION="$(curl -fsSL "$MANIFEST" 2>/dev/null \
              | grep -E '^app_version:' \
              | head -1 \
              | cut -d: -f2 \
              | tr -d ' \"' || true)"
            VERSION="${VERSION:-0.0.0-dev}"
          fi

          IMAGE="${REGISTRY}/${REPOSITORY,,}"

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"
          echo "version=$VERSION"
          echo "image=$IMAGE"

      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            COMPONENT=${{ github.event.repository }}
            BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumir
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}\`"
            echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
            echo "- version: \`${{ steps.meta.outputs.version }}\`"
            echo "- commit: \`${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
